name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck, lint, format, leads:check and the tests (including the dev-server security test).
      - run: pnpm check
      - run: pnpm build
      - name: No personal data in the repository
        shell: bash
        run: |
          bad=$(git ls-files profile dist '*.pdf' '*.docx' '*.doc' '*.odt' '*.rtf' | grep -v '^profile/example/' || true)
          if [ -n "$bad" ]; then echo "Personal files are tracked:"; echo "$bad"; exit 1; fi
